[project]
name = "av-sandbox-compute"
version = "0.1.0"
description = "Offline compute for the viewer: Depth Anything V2 depth, TSDF fusion and Depth Anything 3 splats, written to data/cache."
requires-python = ">=3.12,<3.13"
dependencies = [
    "depth-anything-3 @ git+https://github.com/ByteDance-Seed/Depth-Anything-3@3d835ec1a5802d64a8b8b15f817a1ab54809bfe4",
    "torch>=2.4",
    "torchvision",
    "numpy<2",
    "open3d>=0.19",
    "scipy",
    "pillow",
    "plyfile",
    "safetensors",
    "huggingface_hub",
]

[tool.uv]
package = false
# DA3 declares these but only needs them for CUDA builds, linting, or the demo app.
override-dependencies = [
    "xformers ; sys_platform == 'never'",
    "pre-commit ; sys_platform == 'never'",
]
